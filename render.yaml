services:
  - type: web
    name: ictgoldbot
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run db:deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ict-bot-db
          property: connectionString
      - key: NODE_ENV
        value: production

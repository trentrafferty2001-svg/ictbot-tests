<!-- ICT Pattern Diagrams - Inline SVG Library -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="fvg-bull" viewBox="0 0 200 120">
    <rect width="200" height="120" fill="#0f0f0f"/>
    <!-- Candle 1 bearish -->
    <line x1="40" y1="20" x2="40" y2="100" stroke="#ff3d57" stroke-width="1.5"/>
    <rect x="32" y="35" width="16" height="45" fill="#ff3d57"/>
    <!-- Candle 2 bearish small -->
    <line x1="80" y1="50" x2="80" y2="95" stroke="#ff3d57" stroke-width="1.5"/>
    <rect x="72" y="58" width="16" height="28" fill="#ff3d57"/>
    <!-- Candle 3 bullish - leaves gap -->
    <line x1="120" y1="10" x2="120" y2="58" stroke="#00e676" stroke-width="1.5"/>
    <rect x="112" y="15" width="16" height="38" fill="#00e676"/>
    <!-- FVG zone highlight -->
    <rect x="0" y="50" width="200" height="20" fill="rgba(0,230,118,0.15)" stroke="#00e676" stroke-width="1" stroke-dasharray="4"/>
    <!-- Label -->
    <text x="100" y="112" fill="#00e676" font-size="10" text-anchor="middle" font-family="monospace">Bullish FVG</text>
    <text x="155" y="62" fill="#00e676" font-size="8" font-family="monospace">← FVG Zone</text>
  </symbol>
</svg>
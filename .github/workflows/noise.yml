# Noise-area intraday momentum (Zarattini, Aziz & Barbon 2024) on Nasdaq and DAX.
# Rules: tools/replay/RULES.md, "Noise-area momentum". Added 31 Oct 2026.
# Runs by itself when tools/noise/ changes; or Actions → "Noise-area momentum" → Run workflow.
name: Noise-area momentum

on:
  push:
    paths: ["tools/noise/**", ".github/workflows/noise.yml"]
  workflow_dispatch:
    inputs:
      period:
        description: "development = 2015-2024 (the test) · final = 2025-26 (ONCE, only after development passes) · smoke = March 2024"
        type: choice
        options: [development, final, smoke]
        default: development
      markets:
        description: "Which markets"
        type: choice
        options: [both, nas, ger]
        default: both

permissions:
  contents: write

concurrency:
  group: noise-${{ github.ref }}-${{ inputs.period || 'development' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.p.outputs.years }}
      markets: ${{ steps.p.outputs.markets }}
      period: ${{ steps.p.outputs.period }}
    steps:
      - id: p
        run: |
          PERIOD="${{ inputs.period || 'development' }}"
          case "$PERIOD" in
            development) Y='["2015","2016","2017","2018","2019","2020","2021","2022","2023","2024"]' ;;
            final)       Y='["2025","2026"]' ;;
            smoke)       Y='["2024"]' ;;
          esac
          case "${{ inputs.markets || 'both' }}" in
            both) M='["nas","ger"]' ;;
            *)    M='["${{ inputs.markets }}"]' ;;
          esac
          echo "years=$Y" >> "$GITHUB_OUTPUT"; echo "markets=$M" >> "$GITHUB_OUTPUT"; echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

  prices:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        market: ${{ fromJSON(needs.plan.outputs.markets) }}
        year: ${{ fromJSON(needs.plan.outputs.years) }}
    env:
      INST: ${{ fromJSON('{"nas":"nsxusd","ger":"grxeur"}')[matrix.market] }}
    steps:
      - uses: actions/checkout@v4
      # Same file names and cache keys as the replay workflow, so its downloads are reused.
      - uses: actions/cache@v4
        with:
          path: tools/replay/data/${{ env.INST }}-${{ matrix.year }}.csv.gz
          key: ${{ env.INST }}-m1-${{ matrix.year }}-v3
      - name: Download (skipped if cached)
        run: |
          F="tools/replay/data/$INST-${{ matrix.year }}.csv.gz"
          [ -s "$F" ] && { echo "cached"; exit 0; }
          Y=${{ matrix.year }}
          python3 tools/replay/fetch_data.py --instrument "$INST" --from "$(date -u -d "$Y-01-01 -75 days" +%Y-%m-%d)" --to "$((Y+1))-01-03" --name "$Y"
      - uses: actions/upload-artifact@v4
        with:
          name: px-${{ matrix.market }}-${{ matrix.year }}
          path: tools/replay/data/${{ env.INST }}-${{ matrix.year }}.csv.gz
          retention-days: 3

  judge:
    needs: [plan, prices]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1   # one at a time, so both verdict commits land cleanly
      matrix:
        market: ${{ fromJSON(needs.plan.outputs.markets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          path: px
          pattern: px-${{ matrix.market }}-*
          merge-multiple: true
      - name: Control (random prices, before costs)
        if: needs.plan.outputs.period == 'development'
        run: |
          node tools/noise/judge.js --market ${{ matrix.market }} --period control --seed 1 --label noise-${{ matrix.market }}-control --md control.md
          cat control.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verdict
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          P="${{ needs.plan.outputs.period }}"
          node tools/noise/judge.js --market ${{ matrix.market }} --period "$P" --data px \
            --label noise-${{ matrix.market }} --md verdict.md --out results.json --log tools/replay/VARIANTS.md
          cat verdict.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            HEAD=$(sed -n '1p;3p;7,14p' verdict.md | sed 's/[*#|]//g')
            curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$HEAD" >/dev/null || true
          fi
      - name: Save the verdict and the run log
        if: needs.plan.outputs.period != 'smoke'
        run: |
          git config user.name "replay-bot"
          git config user.email "replay-bot@users.noreply.github.com"
          ROW=$(git diff -U0 -- tools/replay/VARIANTS.md | grep '^+|' | sed 's/^+//' | tail -n 1)
          F="verdicts/noise-${{ matrix.market }}-${{ needs.plan.outputs.period }}-${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            if git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD; then
              [ -n "$ROW" ] && { grep -qxF -- "$ROW" tools/replay/VARIANTS.md || printf '%s\n' "$ROW" >> tools/replay/VARIANTS.md; }
              mkdir -p verdicts && cp verdict.md "$F.md" && gzip -c results.json > "$F.json.gz"
              git add tools/replay/VARIANTS.md "$F.md" "$F.json.gz"
              git commit -q -m "Verdict: noise-${{ matrix.market }} (${{ needs.plan.outputs.period }}) [skip ci] [skip render]" || exit 0
              git push -q origin HEAD:"$GITHUB_REF_NAME" && exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

name: quantlab tests
on:
  push:
    paths: ["quantlab/**", "tests/quantlab/**", "configs/**", "templates/**", "requirements.txt", ".github/workflows/quantlab-tests.yml"]
  pull_request:
    paths: ["quantlab/**", "tests/quantlab/**", "configs/**", "templates/**", "requirements.txt"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
